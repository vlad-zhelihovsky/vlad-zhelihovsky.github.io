name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -r assets ru _site/
          cp trail.js nav.js matrix.js weather.js terminal.js touch.js clocks.js portal.js _site/
          cp *.pdf _site/
          cp *.png _site/
          cp robots.txt sitemap.xml _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # The deploy step sometimes cannot see the artifact uploaded a moment ago; wait and try once more.
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Retry deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
